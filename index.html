<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>初中数学智能课堂</title>
  <link rel="stylesheet" href="style.css" />
  <!-- KaTeX 数学公式渲染 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
    onload="initKaTeX()"></script>
</head>
<body>

<!-- ===== 顶部导航栏 ===== -->
<header class="topbar">
  <button class="btn-icon" id="sidebarToggle" title="展开/收起课件目录 (Alt+S)">
    <svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
  </button>
  <h1 class="topbar-title">初中数学智能课堂</h1>
  <div class="topbar-actions">
    <button class="btn-icon" id="settingsBtn" title="API 设置">
      <svg viewBox="0 0 24 24"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg>
    </button>
    <button class="btn-icon" id="fullscreenBtn" title="全屏模式 (F11)">
      <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
    </button>
  </div>
</header>

<!-- ===== 主体区域 ===== -->
<div class="main-layout">

  <!-- 左侧课件目录 -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">课件目录</div>
    <div id="courseList" class="course-list">
      <!-- 由 JS 动态渲染 -->
    </div>
  </aside>

  <!-- 课件展示区 -->
  <main class="content-area">
    <div class="course-placeholder" id="placeholder">
      <div class="placeholder-inner">
        <svg viewBox="0 0 80 80" width="80"><circle cx="40" cy="40" r="38" fill="none" stroke="#4a9eff" stroke-width="3"/><text x="40" y="52" text-anchor="middle" font-size="36" fill="#4a9eff">∑</text></svg>
        <p>← 从左侧选择一个课件开始上课</p>
        <p class="hint">或按 <kbd>Alt</kbd>+<kbd>S</kbd> 展开目录</p>
      </div>
    </div>
    <iframe id="courseFrame" class="course-frame hidden" allowfullscreen
      sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
  </main>

</div>

<!-- ===== 豆包 AI 助教面板 ===== -->
<div class="ai-fab" id="aiFab" title="打开 AI 助教 (Alt+A)">
  <svg viewBox="0 0 24 24" width="28" height="28"><path fill="white" d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-7 9h-2V5h2v6zm0 4h-2v-2h2v2z"/></svg>
  <span class="fab-label">问豆包</span>
</div>

<div class="ai-panel" id="aiPanel">
  <div class="ai-panel-header">
    <span class="ai-title">
      <svg viewBox="0 0 24 24" width="18" height="18"><path fill="#4a9eff" d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
      豆包数学助教
    </span>
    <div class="ai-header-actions">
      <button class="btn-text" id="clearChatBtn" title="清空对话">清空</button>
      <button class="btn-icon sm" id="ttsToggleBtn" title="开启/关闭语音朗读 (Alt+T)">
        <svg id="ttsIcon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
      </button>
      <button class="btn-icon sm" id="aiPanelClose">
        <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      </button>
    </div>
  </div>

  <div class="ai-messages" id="aiMessages">
    <div class="message ai-message">
      <div class="message-content">
        你好！我是豆包数学助教 🎓<br/>
        可以随时问我数学问题，我会帮你解题、讲概念、出练习！
      </div>
    </div>
  </div>

  <!-- 快捷指令 -->
  <div class="quick-prompts" id="quickPrompts">
    <button class="quick-btn" data-prompt="请用简单易懂的语言解释刚才讲的数学概念，适合初中生理解。">解释概念</button>
    <button class="quick-btn" data-prompt="请针对这个知识点出一道例题，附带解题步骤。">出例题</button>
    <button class="quick-btn" data-prompt="请总结本节课的重点知识，列出关键公式和结论。">总结本节</button>
    <button class="quick-btn" data-prompt="请出3道难度递进的练习题，不要给答案，让学生思考。">出练习题</button>
    <button class="quick-btn" data-prompt="请给出刚才练习题的解答过程，一步一步详细说明。">公布答案</button>
  </div>

  <div class="ai-input-row">
    <button class="btn-mic" id="micBtn" title="按住说话，松开发送 (Alt+M)">
      <svg id="micIcon" viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5zm6 6c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
    </button>
    <textarea id="aiInput" class="ai-input" placeholder="输入问题 或点麦克风说话..." rows="1"></textarea>
    <button class="btn-send" id="aiSend">
      <svg viewBox="0 0 24 24" width="20" height="20"><path fill="white" d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
  <!-- 语音状态提示 -->
  <div class="voice-status hidden" id="voiceStatus">
    <span class="voice-dot"></span>
    <span id="voiceText">正在聆听...</span>
  </div>
</div>

<!-- ===== API 设置弹窗 ===== -->
<div class="modal-overlay hidden" id="settingsModal">
  <div class="modal">
    <div class="modal-header">
      <h2>豆包 API 设置</h2>
      <button class="btn-icon sm" id="settingsClose">
        <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <label>API Key（火山引擎）
        <input type="password" id="apiKeyInput" placeholder="sk-..." />
      </label>
      <label>模型 ID
        <input type="text" id="modelInput" placeholder="ep-xxxxxxxxxx（豆包 endpoint ID）" />
      </label>
      <label>系统提示词（定义助教角色）
        <textarea id="systemPromptInput" rows="5">你是一名专业的初中数学助教，名叫"豆包"。你的任务是协助初中数学老师上课：
1. 用简洁清晰的语言解释数学概念，适合初中生（13-15岁）理解
2. 解题时展示完整步骤，格式清晰
3. 数学公式使用 LaTeX 格式，用 $...$ 包裹行内公式，用 $$...$$ 包裹独立公式
4. 回答简洁有重点，避免过长
5. 遇到不确定的内容，如实告知</textarea>
      </label>
      <p class="modal-hint">
        API Key 仅保存在本地浏览器，不会上传到任何服务器。<br/>
        火山引擎控制台：<code>console.volcengine.com/ark</code>
      </p>
    </div>
    <div class="modal-footer">
      <button class="btn-primary" id="settingsSave">保存设置</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
